name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PGR_TEST_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Started by hand (not a service container) so pg_stat_statements can be
      # preloaded — the profile package needs it, and service containers cannot
      # pass server flags.
      - name: Start Postgres with pg_stat_statements
        run: |
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres \
            postgres:17 -c shared_preload_libraries=pg_stat_statements
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 1; done
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "::error::gofmt needed on:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...
      - name: build
        run: go build ./...

  lint:
    runs-on: ubuntu-latest
    # Advisory only: does not block merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  demo-smoke:
    # Proves the demo environment still seeds and the traffic generator still runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start demo databases (seeds ~1M orders)
        run: docker compose -f demo/docker-compose.yml up -d --wait --wait-timeout 300
      - name: Run traffic for 20s
        run: go run ./demo/traffic -rate 100 -duration 20s -report-every 10s -stats-every 10s
      - name: Tear down
        if: always()
        run: docker compose -f demo/docker-compose.yml down -v
